<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>SacramentoBuyNothing — Local Gifting</title>
    <meta name="description" content="SacramentoBuyNothing — give away items and request what you need. No selling, no bidding, no flipping. Neighbors helping neighbors." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/jpeg" href="/Logo.jpeg" />
    <link rel="apple-touch-icon" href="/Logo.jpeg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SacramentoBuyNothing" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="dns-prefetch" href="https://api.dicebear.com" />
    <script>
      (function () {
        var k = 'sbn_theme';
        var t = localStorage.getItem(k);
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.classList.add(t);
        document.documentElement.style.colorScheme = t;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'light' ? '#ffffff' : '#0b0b0c');
        if (localStorage.getItem('sbn_profile_cache_v1')) {
          document.documentElement.classList.add('sbn-session-restore');
        }
        if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
          document.documentElement.classList.add('capacitor-native');
          if (window.Capacitor.getPlatform() === 'android') {
            document.documentElement.classList.add('capacitor-android');
          }
        }
        var host = (location.hostname || '').replace(/^www\./, '');
        var params = new URLSearchParams(location.search);
        var hashQ = location.hash.indexOf('?') >= 0
          ? new URLSearchParams(location.hash.slice(location.hash.indexOf('?') + 1))
          : null;
        var skin = params.get('skin') || (hashQ && hashQ.get('skin'));
        var stored = sessionStorage.getItem('sbn_newspaper_preview');
        var production = host === 'sacramentobuynothing.com';
        var native = document.documentElement.classList.contains('capacitor-native');
        var newspaper =
          skin === 'newspaper' ||
          (skin !== 'original' && stored === '1') ||
          (skin !== 'original' && stored !== '0' && !production && !native);
        if (newspaper) {
          document.documentElement.classList.add('newspaper-preview');
          document.title = 'The Sacramento Free — All the news that’s free to give';
          if (meta) meta.setAttribute('content', t === 'light' ? '#f3ead6' : '#1a1612');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
